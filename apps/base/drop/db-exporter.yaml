# Metrics exporter for Drop's Postgres (CHG0030484). A separate Deployment, not a sidecar,
# so adding or removing it never restarts the database. Runs on workernode to
# keep its memory off thinkserver; it reaches the database over its Service.
# Scraped by the `db-exporters` PodMonitor in monitoring.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: drop-db-exporter
  namespace: drop
  labels:
    app: drop-db-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: drop-db-exporter
  template:
    metadata:
      labels:
        app: drop-db-exporter
        app.kubernetes.io/component: db-exporter
        db: drop-postgres
    spec:
      nodeSelector:
        kubernetes.io/hostname: workernode
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
          env:
            - name: DATA_SOURCE_URI
              value: "drop-db:5432/drop?sslmode=disable"
            - name: DATA_SOURCE_USER
              value: "drop"
            - name: DATA_SOURCE_PASS
              valueFrom:
                secretKeyRef:
                  name: drop-secrets
                  key: POSTGRES_PASSWORD
          ports:
            - name: metrics
              containerPort: 9187
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              memory: 96Mi
