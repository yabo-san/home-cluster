apiVersion: apps/v1
kind: Deployment
metadata:
  name: drop
  namespace: drop
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: drop
  template:
    metadata:
      labels:
        app: drop
      annotations:
        # CHG0030481: the OpenTelemetry Operator injects the Node SDK at
        # admission (init container + NODE_OPTIONS), every trace kept (low-traffic), straight to
        # Tempo. Drop is Node 24 / Nitro; http and pg are instrumented, which
        # is the whole request path. Remove the annotation to back out.
        instrumentation.opentelemetry.io/inject-nodejs: "monitoring/low-traffic"
    spec:
      # The game library is a hostPath on this node.
      nodeSelector:
        kubernetes.io/hostname: thinkserver
      # A Service named `drop` would inject DROP_PORT into the container.
      enableServiceLinks: false
      # Drop runs migrations at startup and exits if the database is unreachable;
      # the kubelet's restart backoff covers a cold start (CHG0030479).
      containers:
        - name: drop
          # Pinned by DIGEST, not tag. Upstream has no stable release, and
          # v0.4.0-rc-5 (tagged 2026-06-29) predates the fix for issue #481,
          # which makes every Steam import fail when a game has no description
          # (`Argument mDescription is missing`). Fixed 2026-08-30, so the only
          # image with it is `latest`.
          #
          # A digest is reproducible where `latest` is not: this is exactly the
          # bytes that were tested, and Renovate can still raise a PR for it.
          image: ghcr.io/drop-oss/drop@sha256:2995f0b75ac3a6bc4d33b584f80882c3415f8bd9182c264378e3829b259b0bd4
          ports:
            - containerPort: 3000
          env:
            - name: EXTERNAL_URL
              value: https://gaben.y4bo.com
            - name: OIDC_CLIENT_ID
              value: drop
            - name: OIDC_WELLKNOWN
              value: https://id.y4bo.com/realms/y4bo/.well-known/openid-configuration
            # Group-based admin, unlike RomM which can only do user/admin.
            - name: OIDC_ADMIN_GROUP
              value: platform-admin
            # Only the games group (or platform-admin) can create a Drop account.
            # Checked when the account is first created; existing accounts keep
            # working.
            - name: OIDC_USER_GROUP
              value: games
            - name: TZ
              value: America/Los_Angeles
          envFrom:
            # DATABASE_URL (carries the password) and OIDC_CLIENT_SECRET.
            - secretRef:
                name: drop-secrets
          volumeMounts:
            - name: data
              mountPath: /data
            - name: library
              mountPath: /library
              # Read-only: importing indexes the files, it should not move them.
              readOnly: true
          startupProbe:
            httpGet:
              path: /
              port: 3000
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: drop-data
        - name: library
          hostPath:
            path: /mnt/media/games/pc
            type: Directory
