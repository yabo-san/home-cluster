# Tunnel for gaben.y4bo.com. Same pattern as apps/base/romm/.
#
# Do not create the DNS record until the pod is running with OIDC configured
# and a login has been verified.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: drop
spec:
  selector:
    matchLabels:
      app: cloudflared-drop
  replicas: 2
  template:
    metadata:
      labels:
        app: cloudflared-drop
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.9.3
          args: [tunnel, --config, /etc/cloudflared/config/config.yaml, run]
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            failureThreshold: 1
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared/config
              readOnly: true
            - name: creds
              mountPath: /etc/cloudflared/creds
              readOnly: true
      volumes:
        - name: creds
          secret:
            secretName: tunnel-credentials
        - name: config
          configMap:
            name: cloudflared
            items:
              - key: config.yaml
                path: config.yaml
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared
  namespace: drop
data:
  config.yaml: |
    tunnel: drop
    credentials-file: /etc/cloudflared/creds/credentials.json

    metrics: 0.0.0.0:2000
    no-autoupdate: true

    ingress:
    - hostname: gaben.y4bo.com
      service: http://drop:3000
    - service: http_status:404
