apiVersion: apps/v1
kind: Deployment
metadata:
  name: romm
  namespace: romm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: romm
  template:
    metadata:
      labels:
        app: romm
    spec:
      # The ROM library is a hostPath on this node.
      nodeSelector:
        kubernetes.io/hostname: thinkserver
      # A Service named `romm` would inject ROMM_PORT and crash-loop the app.
      enableServiceLinks: false
      # RomM runs schema migrations at startup and exits non-zero if the database
      # is unreachable. Pods start in parallel, so without an ordering gate it
      # crash-loops until mariadb happens to win the race.
      initContainers:
        - name: wait-for-db
          # A TCP check, not `mariadb-admin ping`: ping authenticates, and with no
          # credentials it fails forever even against a healthy server.
          image: busybox:1.37
          command:
            - sh
            - -c
            - until nc -z romm-db 3306; do echo waiting for romm-db; sleep 2; done
      containers:
        - name: romm
          image: rommapp/romm:5.3.1
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: romm-db
            - name: DB_NAME
              value: romm
            - name: DB_USER
              value: romm-user
            - name: HASHEOUS_API_ENABLED
              value: "true"

            - name: OIDC_ENABLED
              value: "true"
            - name: OIDC_PROVIDER
              value: keycloak
            - name: OIDC_CLIENT_ID
              value: romm
            - name: OIDC_SERVER_APPLICATION_URL
              value: https://id.y4bo.com/realms/y4bo
            # No default in the app. Must match the Keycloak client exactly.
            - name: OIDC_REDIRECT_URI
              value: https://rom.y4bo.com/api/oauth/openid
            # The access gate. Default "true" auto-creates an account for any
            # Keycloak user; accounts are created by hand instead
            - name: OIDC_ALLOW_REGISTRATION
              value: "false"
            # Needs a groups claim mapper on the Keycloak client to do anything.
            - name: OIDC_CLAIM_ROLES
              value: groups
            - name: OIDC_ROLE_ADMIN
              value: platform-admin

            # In-browser players. Global switches, not permissions.
            # EmulatorJS on (retro consoles in the browser; accounts are made by
            # hand, so only invited users reach it). Flash and DOS players off.
            - name: DISABLE_EMULATOR_JS
              value: "false"
            - name: DISABLE_RUFFLE_RS
              value: "true"
            - name: DISABLE_JSDOS
              value: "true"

            # OpenTelemetry. RomM bundles the SDK and disables it when these
            # are absent, which is what its startup log reports.
            - name: OTEL_SERVICE_NAME
              value: romm
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://tempo.monitoring.svc.cluster.local:4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            - name: OTEL_METRICS_EXPORTER
              value: none
            - name: OTEL_LOGS_EXPORTER
              value: none
            # 5% of traces. At the default 100%, a full library scan flooded
            # Tempo with more spans than it could turn into a block.
            - name: OTEL_TRACES_SAMPLER
              value: parentbased_traceidratio
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.05"

            - name: TZ
              value: America/Los_Angeles
          envFrom:
            - secretRef:
                name: romm-secrets
          volumeMounts:
            - name: data
              mountPath: /romm/resources
              subPath: resources
            - name: data
              mountPath: /romm/assets
              subPath: assets
            - name: data
              mountPath: /romm/config
              subPath: config
            - name: data
              mountPath: /redis-data
              subPath: redis
            - name: library
              mountPath: /romm/library/roms
              readOnly: true
            # RomM's default firmware layout is bios/{platform} beside roms/,
            # so BIOS files show per platform in the UI and the web player.
            - name: firmware
              mountPath: /romm/library/bios
              readOnly: true
          startupProbe:
            httpGet:
              path: /api/heartbeat
              port: 8080
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/heartbeat
              port: 8080
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: romm-data
        - name: library
          hostPath:
            # Real path, not the /mnt/games symlink.
            path: /mnt/media/games/0 ROMS
            type: Directory
        - name: firmware
          hostPath:
            path: /mnt/media/games/bios
            type: Directory
