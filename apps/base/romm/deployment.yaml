apiVersion: apps/v1
kind: Deployment
metadata:
  name: romm
  namespace: romm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: romm
  template:
    metadata:
      labels:
        app: romm
    spec:
      # The ROM library is a hostPath on this node.
      nodeSelector:
        kubernetes.io/hostname: thinkserver
      # A Service named `romm` would inject ROMM_PORT and crash-loop the app.
      enableServiceLinks: false
      containers:
        - name: romm
          image: rommapp/romm:5.3.1
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: romm-db
            - name: DB_NAME
              value: romm
            - name: DB_USER
              value: romm-user
            - name: HASHEOUS_API_ENABLED
              value: "true"

            - name: OIDC_ENABLED
              value: "true"
            - name: OIDC_PROVIDER
              value: keycloak
            - name: OIDC_CLIENT_ID
              value: romm
            - name: OIDC_SERVER_APPLICATION_URL
              value: https://id.y4bo.com/realms/y4bo
            # No default in the app. Must match the Keycloak client exactly.
            - name: OIDC_REDIRECT_URI
              value: https://rom.y4bo.com/api/oauth/openid
            # The access gate. Default "true" auto-creates an account for any
            # Keycloak user; accounts are created by hand instead. CHG0030426.
            - name: OIDC_ALLOW_REGISTRATION
              value: "false"
            # Needs a groups claim mapper on the Keycloak client to do anything.
            - name: OIDC_CLAIM_ROLES
              value: groups
            - name: OIDC_ROLE_ADMIN
              value: platform-admin

            # In-browser players. Global switches, not permissions. CHG0030426.
            - name: DISABLE_EMULATOR_JS
              value: "true"
            - name: DISABLE_RUFFLE_RS
              value: "true"
            - name: DISABLE_JSDOS
              value: "true"

            - name: TZ
              value: America/Los_Angeles
          envFrom:
            - secretRef:
                name: romm-secrets
          volumeMounts:
            - name: data
              mountPath: /romm/resources
              subPath: resources
            - name: data
              mountPath: /romm/assets
              subPath: assets
            - name: data
              mountPath: /romm/config
              subPath: config
            - name: data
              mountPath: /redis-data
              subPath: redis
            - name: library
              mountPath: /romm/library/roms
              readOnly: true
          startupProbe:
            httpGet:
              path: /api/heartbeat
              port: 8080
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/heartbeat
              port: 8080
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: romm-data
        - name: library
          hostPath:
            # Real path, not the /mnt/games symlink.
            path: /mnt/media/games/0 ROMS
            type: Directory
