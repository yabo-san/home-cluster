# Derived state only: scan index, box art, config. The ROM files stay on disk
# and are mounted read-only as a hostPath. local-path is node-local, so every
# pod mounting these is pinned to thinkserver.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: romm-data
  namespace: romm
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      # Box art from IGDB is what grows here.
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: romm-db
  namespace: romm
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
