# Metrics exporter for RomM's MariaDB (CHG0030484). A separate Deployment, not a sidecar,
# so adding or removing it never restarts the database. Runs on workernode to
# keep its memory off thinkserver; it reaches the database over its Service.
# Scraped by the `db-exporters` PodMonitor in monitoring.
# Connects as the app user, not root: global status, connections, slow queries
# and InnoDB counters need no extra grants. Process-list and replication
# collectors are off because the app user may not read them.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: romm-db-exporter
  namespace: romm
  labels:
    app: romm-db-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: romm-db-exporter
  template:
    metadata:
      labels:
        app: romm-db-exporter
        app.kubernetes.io/component: db-exporter
        db: romm-mariadb
    spec:
      nodeSelector:
        kubernetes.io/hostname: workernode
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: prom/mysqld-exporter:v0.20.0
          args:
            - "--mysqld.address=romm-db:3306"
            - "--mysqld.username=romm-user"
            - "--no-collect.slave_status"
          env:
            - name: MYSQLD_EXPORTER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: romm-secrets
                  key: MARIADB_PASSWORD
          ports:
            - name: metrics
              containerPort: 9104
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              memory: 96Mi
