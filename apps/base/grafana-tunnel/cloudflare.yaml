apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app: cloudflared-grafana
  replicas: 2
  template:
    metadata:
      labels:
        app: cloudflared-grafana
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          args:
            - tunnel
            - --config
            - /etc/cloudflared/config/config.yaml
            - run
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            failureThreshold: 1
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared/config
              readOnly: true
            - name: creds
              mountPath: /etc/cloudflared/creds
              readOnly: true
      volumes:
        - name: creds
          secret:
            secretName: tunnel-credentials
        - name: config
          configMap:
            name: cloudflared
            items:
              - key: config.yaml
                path: config.yaml
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared
  namespace: monitoring
data:
  config.yaml: |
    # Tunnel name is cosmetic here; the credentials.json below is what actually
    # binds this cloudflared to your Cloudflare tunnel (by UUID). Create it with:
    #   cloudflared tunnel create monitoring
    tunnel: monitoring
    credentials-file: /etc/cloudflared/creds/credentials.json

    metrics: 0.0.0.0:2000
    no-autoupdate: true

    ingress:
    # Grafana lives in THIS namespace (monitoring), so the short service name works.
    - hostname: monitoring.y4bo.com
      service: http://kube-prometheus-stack-grafana:80
    # Catch-all: anything else gets a 404 instead of leaking to a default.
    - service: http_status:404
