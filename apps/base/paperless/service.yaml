# NodePort, not LoadBalancer or an ingress: this is reached over Tailscale only.
# thinkserver's tailnet address is 100.99.35.21, and a NodePort listens on every
# node interface including the tailscale0 one, so http://100.99.35.21:30080 works
# from any device on the tailnet and from nowhere else.
apiVersion: v1
kind: Service
metadata:
  name: paperless
  namespace: paperless
spec:
  type: NodePort
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
  selector:
    app: paperless
