apiVersion: apps/v1
kind: Deployment
metadata:
  name: lldap
  namespace: lldap
spec:
  replicas: 1
  # One SQLite writer. Recreate, never RollingUpdate: a rolling update starts
  # the new pod before the old one exits, and two processes opening the same
  # SQLite file is how it gets corrupted. Same rule as paperless.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: lldap
  template:
    metadata:
      labels:
        app: lldap
    spec:
      # local-path is node-local, so the data only exists on this node.
      nodeSelector:
        kubernetes.io/hostname: thinkserver
      # A Service named "lldap" would inject LLDAP_PORT, which LLDAP reads as
      # its own config.
      enableServiceLinks: false
      securityContext:
        # The image runs as uid 1000 and needs to own /data on first start.
        fsGroup: 1000
      containers:
        - name: lldap
          # Pinned. An LDAP server is not a thing to let float on :latest.
          image: lldap/lldap:v0.6.3
          ports:
            - name: ldap
              containerPort: 3890
            - name: http
              containerPort: 17170
          env:
            # Baked into the Keycloak federation and the Jellyfin plugin.
            - name: LLDAP_LDAP_BASE_DN
              value: dc=y4bo,dc=com
            # The bootstrap admin account. Its password comes from the secret.
            - name: LLDAP_LDAP_USER_DN
              value: admin
            - name: TZ
              value: America/Los_Angeles
          envFrom:
            # JWT secret, key seed and the admin password. See secret.yaml.
            - secretRef:
                name: lldap-secrets
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /
              port: 17170
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 17170
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              # A Rust binary serving SQLite. It does not need more, and a limit
              # keeps it from being the thing that surprises a 7.4Gi node.
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: lldap-data
