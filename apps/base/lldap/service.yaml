# Not a plain ClusterIP: Jellyfin runs on another machine on the LAN and cannot
# route to a ClusterIP. externalIPs binds exactly one address; a NodePort would
# listen on every interface of every node.
apiVersion: v1
kind: Service
metadata:
  name: lldap
  namespace: lldap
spec:
  type: ClusterIP
  externalIPs:
    - 192.168.4.20
  ports:
    - name: ldap
      port: 3890
      targetPort: 3890
    - name: http
      port: 17170
      targetPort: 17170
  selector:
    app: lldap
