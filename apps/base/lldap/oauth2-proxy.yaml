# oauth2-proxy in front of LLDAP's admin page for users.y4bo.com (CHG0030487).
# Gate 1 of 2: only a Keycloak session whose "groups" claim contains platform-admin
# gets through; everyone else gets a 403 here and never sees LLDAP at all. Gate 2 is
# LLDAP's own login, with each admin's own account in lldap_admin.
# Same shape as apps/base/portal/oauth2-proxy.yaml; the differences are the client,
# the upstream and the group gate. The tailnet path (service-admin.yaml) is
# untouched and stays the owner's break-glass way in.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lldap-admin-proxy
  namespace: lldap
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lldap-admin-proxy
  template:
    metadata:
      labels:
        app: lldap-admin-proxy
    spec:
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
          env:
            - name: OAUTH2_PROXY_PROVIDER
              value: oidc
            - name: OAUTH2_PROXY_OIDC_ISSUER_URL
              value: https://id.y4bo.com/realms/y4bo
            # Its own confidential client, not the portal's, so the redirect URI
            # and the gate can be changed or revoked without touching login.y4bo.com.
            - name: OAUTH2_PROXY_CLIENT_ID
              value: lldap-admin
            # Client secret + cookie seed come from the SOPS'd secret
            # (apps/staging/lldap/proxy-secret.yaml).
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: lldap-admin-proxy
                  key: client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: lldap-admin-proxy
                  key: cookie-secret
            - name: OAUTH2_PROXY_REDIRECT_URL
              value: https://users.y4bo.com/oauth2/callback
            # The existing Service "lldap", port http. Cluster-internal, so the
            # LAN externalIP and the tailnet externalIP are not in this path.
            - name: OAUTH2_PROXY_UPSTREAMS
              value: http://lldap:17170
            - name: OAUTH2_PROXY_HTTP_ADDRESS
              value: 0.0.0.0:4180
            - name: OAUTH2_PROXY_EMAIL_DOMAINS
              value: "*"
            - name: OAUTH2_PROXY_SCOPE
              value: openid email profile groups
            # The gate. Plain group name, no leading slash: the groups mapper on
            # this client must have "Full group path" off, same as romm and drop.
            - name: OAUTH2_PROXY_ALLOWED_GROUPS
              value: platform-admin
            - name: OAUTH2_PROXY_COOKIE_SECURE
              value: "true"
            # A separate cookie name from the portal's, so the two sessions on
            # .y4bo.com never overwrite each other.
            - name: OAUTH2_PROXY_COOKIE_NAME
              value: _oauth2_proxy_users
            - name: OAUTH2_PROXY_REVERSE_PROXY
              value: "true"                    # trust the tunnel's forwarded headers
            - name: OAUTH2_PROXY_SKIP_PROVIDER_BUTTON
              value: "true"                    # jump straight to Keycloak, no interstitial
            - name: OAUTH2_PROXY_WHITELIST_DOMAINS
              value: .y4bo.com
            - name: OAUTH2_PROXY_INSECURE_OIDC_ALLOW_UNVERIFIED_EMAIL
              value: "true"                    # every user is made by hand in LLDAP
          ports:
            - containerPort: 4180
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: lldap-admin-proxy
  namespace: lldap
spec:
  selector:
    app: lldap-admin-proxy
  ports:
    - port: 4180
      targetPort: 4180
