# Admin web UI only, on the tailnet. Separate from service.yaml because
# externalIPs applies to the whole Service, and LDAP must stay on the LAN.
apiVersion: v1
kind: Service
metadata:
  name: lldap-admin
  namespace: lldap
spec:
  type: ClusterIP
  externalIPs:
    - 100.99.35.21
  ports:
    - name: http
      port: 17170
      targetPort: 17170
  selector:
    app: lldap
