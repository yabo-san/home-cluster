# Cloudflare tunnel for login.y4bo.com. It routes to oauth2-proxy (the gate),
# NOT Homepage directly — so the very first request already hits authentication.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: portal
spec:
  selector:
    matchLabels:
      app: cloudflared-portal
  replicas: 2
  template:
    metadata:
      labels:
        app: cloudflared-portal
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          args: ["tunnel", "--config", "/etc/cloudflared/config/config.yaml", "run"]
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            failureThreshold: 1
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared/config
              readOnly: true
            - name: creds
              mountPath: /etc/cloudflared/creds
              readOnly: true
      volumes:
        - name: creds
          secret:
            secretName: tunnel-credentials
        - name: config
          configMap:
            name: cloudflared
            items:
              - key: config.yaml
                path: config.yaml
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared
  namespace: portal
data:
  config.yaml: |
    # cloudflared tunnel create portal   (then route: login.y4bo.com)
    tunnel: portal
    credentials-file: /etc/cloudflared/creds/credentials.json
    metrics: 0.0.0.0:2000
    no-autoupdate: true
    ingress:
    - hostname: login.y4bo.com
      service: http://oauth2-proxy:4180
    - service: http_status:404
