# login.y4bo.com: one URL to share. Sends everyone to the Keycloak portal (y4bo theme), which
# shows each user the apps their LLDAP groups allow (CHG0030486).
apiVersion: v1
kind: ConfigMap
metadata:
  name: portal-redirect
data:
  default.conf: |
    server {
      listen 8080;
      location = /healthz { return 200 "ok\n"; }
      location / { return 302 https://id.y4bo.com/realms/y4bo/account; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal-redirect
  labels:
    app: portal-redirect
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portal-redirect
  template:
    metadata:
      labels:
        app: portal-redirect
    spec:
      nodeSelector:
        kubernetes.io/hostname: thinkserver
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.29-alpine
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 32Mi
      volumes:
        - name: conf
          configMap:
            name: portal-redirect
---
apiVersion: v1
kind: Service
metadata:
  name: portal-redirect
spec:
  selector:
    app: portal-redirect
  ports:
    - port: 8080
      targetPort: 8080
