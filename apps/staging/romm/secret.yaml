# SOPS-encrypted. Consumed by BOTH Deployments via envFrom.secretRef, so the
# keys here are the literal environment variable names each image expects.
#
# MARIADB_PASSWORD and DB_PASSWD MUST HOLD THE SAME VALUE. The first is what
# mariadb creates the account with, the second is what RomM connects with. They
# are separate keys because the two images read different variable names, not
# because they are different passwords.
#
# The compose file this replaces carried the documentation defaults unchanged:
# `changeme_romm` and `changeme_romm_root`. Both regenerated here.
#
# IGDB credentials are carried over verbatim from /opt/yams/docker-compose.custom.yaml
# on thinkserver. They are a metadata API key, not a secret of his, but they are
# rate-limited per client so they do not belong in a plaintext manifest.
#
# OIDC_CLIENT_SECRET is the one value that cannot be generated here: Keycloak
# mints it when the `romm` client is created. Until it is filled in, this app is
# deliberately NOT enabled in apps/staging/kustomization.yaml.
apiVersion: v1
kind: Secret
metadata:
    name: romm-secrets
    namespace: romm
type: Opaque
