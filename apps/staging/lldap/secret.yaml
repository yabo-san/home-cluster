# SOPS-encrypted. Three values, all generated, none chosen:
#
#   LLDAP_JWT_SECRET     signs the session tokens LLDAP issues for its own web
#                        UI. Changing it invalidates every active session.
#   LLDAP_KEY_SEED       derives the server's private key material. Changing it
#                        after users exist INVALIDATES STORED PASSWORD DATA.
#                        Treat as permanent once set.
#   LLDAP_LDAP_USER_PASS the bootstrap `admin` account's password. This is the
#                        bind credential Keycloak uses for federation, and the
#                        login for the admin UI on port 17170.
#
# These are read via envFrom.secretRef in the Deployment, so the KEYS here are
# the literal environment variable names LLDAP expects.
