# Credentials for the `lldap` tunnel. After `cloudflared tunnel create lldap`:
#   kubectl create secret generic tunnel-credentials -n lldap \
#     --from-file=credentials.json=$HOME/.cloudflared/<TUNNEL_ID>.json \
#     --dry-run=client -o yaml > apps/staging/lldap/tunnel-secret.yaml
#   sops --encrypt --in-place apps/staging/lldap/tunnel-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: tunnel-credentials
  namespace: lldap
stringData:
  credentials.json: REPLACE_WITH_TUNNEL_CREDENTIALS_JSON
