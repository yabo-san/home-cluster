# PLACEHOLDER: FILL AND SOPS-ENCRYPT BEFORE MERGE (public repo). Not in
# kustomization.yaml yet, on purpose (CHG0030487).
# oauth2-proxy for users.y4bo.com needs two secrets:
#   - client-secret : from the Keycloak client `lldap-admin` (Credentials tab)
#   - cookie-secret : seeds session-cookie encryption. Generate with:
#                     openssl rand -base64 32
# Then: sops --encrypt --in-place apps/staging/lldap/proxy-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: lldap-admin-proxy
  namespace: lldap
stringData:
  client-secret: REPLACE_WITH_KEYCLOAK_CLIENT_SECRET
  cookie-secret: REPLACE_WITH_32_BYTE_COOKIE_SECRET
