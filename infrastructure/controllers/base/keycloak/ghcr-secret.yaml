# Pull secret for a private GHCR image; unused while the package is public (CHG0030486).
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-pull
  namespace: keycloak
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: '{"auths":{"ghcr.io":{"auth":"REPLACE_WITH_BASE64_USER_COLON_PAT"}}}'
