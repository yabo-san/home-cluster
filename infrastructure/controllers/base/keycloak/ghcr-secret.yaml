# PLACEHOLDER: FILL AND SOPS-ENCRYPT BEFORE MERGE (public repo). Not in
# kustomization.yaml yet, on purpose: an unencrypted or empty pull secret must
# never reach Flux (CHG0030486).
#
# Pull secret for the private GHCR package ghcr.io/yabo-san/keycloak-y4bo.
# Use a fine-grained or classic PAT with read:packages only, not the owner's
# main token. Build the value and encrypt:
#
#   AUTH=$(printf '%s' 'yabo-san:<PAT>' | base64 -w0)
#   printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' "$AUTH"
#   # paste that JSON as .dockerconfigjson under stringData below, then:
#   sops --encrypt --in-place infrastructure/controllers/base/keycloak/ghcr-secret.yaml
#
# Then add ghcr-secret.yaml to kustomization.yaml (the comment there marks where).
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-pull
  namespace: keycloak
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: '{"auths":{"ghcr.io":{"auth":"REPLACE_WITH_BASE64_USER_COLON_PAT"}}}'
