# Metrics exporter for Keycloak's Postgres (CHG0030484). A separate Deployment, not a sidecar,
# so adding or removing it never restarts the database. Runs on workernode to
# keep its memory off thinkserver; it reaches the database over its Service.
# Scraped by the `db-exporters` PodMonitor in monitoring.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak-db-exporter
  namespace: keycloak
  labels:
    app: keycloak-db-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak-db-exporter
  template:
    metadata:
      labels:
        app: keycloak-db-exporter
        app.kubernetes.io/component: db-exporter
        db: keycloak-postgres
    spec:
      nodeSelector:
        kubernetes.io/hostname: thinkserver   # stateless; off the worker (CHG0030492)
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
          env:
            - name: DATA_SOURCE_URI
              value: "keycloak-postgres:5432/keycloak?sslmode=disable"
            - name: DATA_SOURCE_USER
              valueFrom:
                secretKeyRef:
                  name: keycloak-db
                  key: username
            - name: DATA_SOURCE_PASS
              valueFrom:
                secretKeyRef:
                  name: keycloak-db
                  key: password
          ports:
            - name: metrics
              containerPort: 9187
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              memory: 96Mi
