# Emails new LLDAP users a link to set their own password. Creating the user in
# LLDAP is the only manual step; this handles everything after it.
#
# State lives in a ConfigMap, not on the user. A federated user cannot hold an
# arbitrary Keycloak attribute: edit mode is WRITABLE, so Keycloak writes
# attributes through to LLDAP, whose schema drops anything it does not know.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keycloak-welcome
  namespace: keycloak
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: keycloak-welcome
  namespace: keycloak
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["keycloak-welcomed"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: keycloak-welcome
  namespace: keycloak
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: keycloak-welcome
subjects:
  - kind: ServiceAccount
    name: keycloak-welcome
    namespace: keycloak
---
# Seeded with the two existing admins so the first run does not email them.
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-welcomed
  namespace: keycloak
data:
  welcomed: |
    yabosan
    goose
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-welcome-script
  namespace: keycloak
data:
  welcome.py: |
    #!/usr/bin/env python3
    """Email a set-password link to any LLDAP user who has not had one."""
    import json, os, ssl, sys, urllib.parse, urllib.request

    BASE     = os.environ["KC_URL"].rstrip("/")
    REALM    = os.environ["KC_REALM"]
    PROVIDER = os.environ["KC_LDAP_PROVIDER_ID"]
    KUSER    = os.environ["KC_ADMIN_USER"]
    KPASS    = os.environ["KC_ADMIN_PASSWORD"]
    REDIRECT = os.environ["KC_REDIRECT_URI"]
    CLIENT   = os.environ.get("KC_REDIRECT_CLIENT", "account-console")
    DRY      = os.environ.get("DRY_RUN", "false").lower() == "true"

    NS  = os.environ.get("POD_NAMESPACE", "keycloak")
    CM  = "keycloak-welcomed"
    K8S = "https://kubernetes.default.svc"
    SA  = "/var/run/secrets/kubernetes.io/serviceaccount"

    SKIP = {"admin", "service-account"}

    def req(url, method="GET", body=None, headers=None, ctx=None,
            ctype="application/json"):
        data = json.dumps(body).encode() if isinstance(body, (dict, list)) else body
        r = urllib.request.Request(url, data=data, method=method)
        for k, v in (headers or {}).items():
            r.add_header(k, v)
        if data is not None:
            r.add_header("Content-Type", ctype)
        with urllib.request.urlopen(r, timeout=30, context=ctx) as resp:
            raw = resp.read()
            return json.loads(raw) if raw else None

    k8s_ctx = ssl.create_default_context(cafile=f"{SA}/ca.crt")
    with open(f"{SA}/token") as f:
        k8s_hdr = {"Authorization": f"Bearer {f.read().strip()}"}

    def welcomed_get():
        cm = req(f"{K8S}/api/v1/namespaces/{NS}/configmaps/{CM}",
                 headers=k8s_hdr, ctx=k8s_ctx)
        raw = (cm.get("data") or {}).get("welcomed", "")
        return [l.strip() for l in raw.splitlines() if l.strip()]

    def welcomed_set(names):
        req(f"{K8S}/api/v1/namespaces/{NS}/configmaps/{CM}", method="PATCH",
            body={"data": {"welcomed": "\n".join(names) + "\n"}},
            headers=k8s_hdr, ctx=k8s_ctx, ctype="application/merge-patch+json")

    def kc_token():
        body = urllib.parse.urlencode({
            "client_id": "admin-cli", "grant_type": "password",
            "username": KUSER, "password": KPASS,
        }).encode()
        return req(f"{BASE}/realms/master/protocol/openid-connect/token",
                   method="POST", body=body,
                   ctype="application/x-www-form-urlencoded")["access_token"]

    def main():
        kc = {"Authorization": f"Bearer {kc_token()}"}

        # A new LLDAP user has no Keycloak row until something imports them, and
        # the group mapper is LDAP_ONLY so nothing does on its own.
        try:
            req(f"{BASE}/admin/realms/{REALM}/user-storage/{PROVIDER}/sync"
                "?action=triggerFullSync", method="POST", body={}, headers=kc)
            print("synced from lldap", flush=True)
        except Exception as e:
            print(f"sync failed, continuing: {e}", file=sys.stderr, flush=True)

        done = welcomed_get()
        users = req(f"{BASE}/admin/realms/{REALM}/users?max=1000", headers=kc) or []

        sent = skipped = failed = 0
        newly = []
        for u in users:
            name = u.get("username", "")
            if name in SKIP or name.startswith("service-account") or name in done:
                skipped += 1
                continue
            if not u.get("email"):
                print(f"skip {name}: no email", flush=True)
                skipped += 1
                continue

            if DRY:
                print(f"DRY RUN would welcome {name} <{u['email']}>", flush=True)
                sent += 1
                continue

            try:
                q = urllib.parse.urlencode(
                    {"client_id": CLIENT, "redirect_uri": REDIRECT})
                req(f"{BASE}/admin/realms/{REALM}/users/{u['id']}"
                    f"/execute-actions-email?{q}", method="PUT",
                    body=["UPDATE_PASSWORD", "VERIFY_EMAIL"], headers=kc)
            except Exception as e:
                print(f"FAILED to email {name}: {e}", file=sys.stderr, flush=True)
                failed += 1
                continue

            # Recorded only after a successful send, so a failure retries.
            newly.append(name)
            print(f"welcomed {name} <{u['email']}>", flush=True)
            sent += 1

        if newly:
            try:
                welcomed_set(done + newly)
                print(f"recorded: {', '.join(newly)}", flush=True)
            except Exception as e:
                # The one bad outcome: they get emailed again next run.
                print(f"WARNING: emailed {newly} but could not record: {e}",
                      file=sys.stderr, flush=True)
                failed += 1

        print(f"done: {sent} welcomed, {skipped} skipped, {failed} failed",
              flush=True)
        sys.exit(1 if failed else 0)

    main()
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: keycloak-welcome
  namespace: keycloak
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: keycloak-welcome
          containers:
            - name: welcome
              image: python:3.12-alpine
              command: ["python3", "/script/welcome.py"]
              env:
                - name: KC_URL
                  value: http://keycloak:8080
                - name: KC_REALM
                  value: y4bo
                - name: KC_LDAP_PROVIDER_ID
                  value: plCGYYniSM6BmcLUwgSMyA
                - name: KC_REDIRECT_URI
                  value: https://id.y4bo.com/realms/y4bo/account
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: KC_ADMIN_USER
                  valueFrom:
                    secretKeyRef:
                      name: keycloak-admin
                      key: username
                - name: KC_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: keycloak-admin
                      key: password
                # "true" logs who would be emailed without sending.
                - name: DRY_RUN
                  value: "true"
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              volumeMounts:
                - name: script
                  mountPath: /script
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: keycloak-welcome-script
