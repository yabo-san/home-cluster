apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "66.2.2"

      # version: "58.x"

      sourceRef:
        kind: HelmRepository
        name: kube-prometheus-stack
        namespace: monitoring
      interval: 12h
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  driftDetection:
    mode: enabled
    ignore:
      # Ignore "validated" annotation which is not inserted during install
      - paths: ["/metadata/annotations/prometheus-operator-validated"]
        target:
          kind: PrometheusRule
  values:
    # added bc k3s sends junk
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false 
    grafana:
      # Was `adminPassword: password` (public repo!). Now sourced from a SOPS'd
      # secret so the tunnel can't expose an admin/password login. Create the
      # `grafana-admin` secret in monitoring/configs/staging before this applies.
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      # OIDC client secret arrives as GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET (env),
      # from the SOPS'd grafana-oidc secret — kept out of this plaintext values file.
      envFromSecret: grafana-oidc
      # NOTE: no Loki datasource here — the loki-stack chart already provisions one
      # via a grafana_datasource-labeled ConfigMap the sidecar loads. Defining a second
      # "Loki" here collided (duplicate datasource name). One source of truth.
      # Hide the chart's ~20 stock dashboards (many read No-data on k3s). The sidecar
      # still loads OUR configmaps (Homelab Overview, Node Exporter Full, Namespaces).
      defaultDashboardsEnabled: false
      # SMTP creds (Proton) for alert emails — user + token from the SOPS'd grafana-smtp secret.
      envValueFrom:
        GF_SMTP_USER:
          secretKeyRef:
            name: grafana-smtp
            key: GF_SMTP_USER
        GF_SMTP_PASSWORD:
          secretKeyRef:
            name: grafana-smtp
            key: GF_SMTP_PASSWORD
      grafana.ini:
        server:
          # Grafana's public URL — so the OIDC redirect_uri it builds matches
          # what's registered in Keycloak. This is the tunnel hostname.
          root_url: https://monitoring.y4bo.com
        auth.generic_oauth:
          enabled: true
          name: Keycloak
          client_id: grafana
          scopes: openid email profile
          auth_url: https://id.y4bo.com/realms/y4bo/protocol/openid-connect/auth
          token_url: https://id.y4bo.com/realms/y4bo/protocol/openid-connect/token
          api_url: https://id.y4bo.com/realms/y4bo/protocol/openid-connect/userinfo
          # Map Keycloak realm roles -> Grafana roles. Give yourself grafana-admin
          # in Keycloak and you land as an Admin; everyone else is a Viewer.
          role_attribute_path: "contains(realm_access.roles[*], 'grafana-admin') && 'Admin' || contains(realm_access.roles[*], 'grafana-editor') && 'Editor' || 'Viewer'"
          allow_sign_up: true
        smtp:
          enabled: true
          host: smtp.protonmail.ch:587
          from_address: kevin@y4bo.com
          from_name: y4bo alerts
          # Proton needs TLS; port 587 = STARTTLS. user/password come from env (above).
          startTLS_policy: MandatoryStartTLS
      # Grafana-managed alerting, provisioned as code. Uses the SMTP above to email.
      alerting:
        contactpoints.yaml:
          apiVersion: 1
          contactPoints:
            - orgId: 1
              name: email-kevin
              receivers:
                - uid: email_kevin
                  type: email
                  settings:
                    addresses: kevin@y4bo.com
                    singleEmail: false
        policies.yaml:
          apiVersion: 1
          policies:
            - orgId: 1
              receiver: email-kevin
              group_by: ["alertname", "instance"]
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 4h
        rules.yaml:
          apiVersion: 1
          groups:
            - orgId: 1
              name: homelab-disk
              folder: Homelab Alerts
              interval: 1m
              rules:
                - uid: disk_almost_full
                  title: DiskAlmostFull
                  condition: C
                  for: 5m
                  data:
                    - refId: A
                      relativeTimeRange: { from: 600, to: 0 }
                      datasourceUid: prometheus
                      model:
                        editorMode: code
                        expr: '100 * (1 - node_filesystem_avail_bytes{mountpoint=~"/|/mnt/data"} / node_filesystem_size_bytes{mountpoint=~"/|/mnt/data"})'
                        instant: true
                        intervalMs: 1000
                        legendFormat: ""
                        maxDataPoints: 43200
                        range: false
                        refId: A
                    - refId: C
                      datasourceUid: __expr__
                      model:
                        conditions:
                          - evaluator: { params: [90], type: gt }
                            operator: { type: and }
                            query: { params: [C] }
                            reducer: { params: [], type: last }
                            type: query
                        datasource: { type: __expr__, uid: __expr__ }
                        expression: A
                        refId: C
                        type: threshold
                  labels:
                    severity: warning
                  annotations:
                    summary: "Filesystem over 90% full — check the instance and mountpoint labels"
                - uid: node_exporter_down
                  title: NodeExporterDown
                  condition: C
                  for: 5m
                  data:
                    - refId: A
                      relativeTimeRange: { from: 600, to: 0 }
                      datasourceUid: prometheus
                      model:
                        editorMode: code
                        expr: 'up{job=~".*node.*"}'
                        instant: true
                        intervalMs: 1000
                        legendFormat: ""
                        maxDataPoints: 43200
                        range: false
                        refId: A
                    - refId: C
                      datasourceUid: __expr__
                      model:
                        conditions:
                          - evaluator: { params: [1], type: lt }
                            operator: { type: and }
                            query: { params: [C] }
                            reducer: { params: [], type: last }
                            type: query
                        datasource: { type: __expr__, uid: __expr__ }
                        expression: A
                        refId: C
                        type: threshold
                  labels:
                    severity: critical
                  annotations:
                    summary: "A node_exporter target is DOWN — check the instance label"
      ingress:
        enabled: true
        ingressClassName: traefik
        hosts:
          - monitoring.y4bo.com
        tls:
          - secretName: grafana-tls-secret
            hosts:
              - monitoring.y4bo.com
    # Alertmanager — the routing/dedup/silencing layer for the Prometheus-native rules
    # (homelab-storage, synthetic). Reuses the Proton SMTP secret (mounted as a file) so
    # no token is duplicated. Silences here are the OSS equivalent of a New Relic "silence".
    alertmanager:
      alertmanagerSpec:
        secrets:
          - grafana-smtp   # mounted at /etc/alertmanager/secrets/grafana-smtp/
      config:
        global:
          smtp_smarthost: "smtp.protonmail.ch:587"
          smtp_from: "kevin@y4bo.com"
          smtp_auth_username: "kevin@y4bo.com"
          smtp_auth_password_file: /etc/alertmanager/secrets/grafana-smtp/GF_SMTP_PASSWORD
          smtp_require_tls: true
        route:
          receiver: "null"
          group_by: ["alertname", "instance"]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 4h
          routes:
            - matchers: ['alertname = "Watchdog"']
              receiver: "null"
            - matchers: ['severity = "critical"']
              receiver: email
        receivers:
          - name: email
            email_configs:
              - to: "kevin@y4bo.com"
                send_resolved: true   
          - name: "null"
        inhibit_rules:
          - source_matchers: ['severity = "critical"']
            target_matchers: ['severity = "warning"']
            equal: ["instance"]
    prometheus:
      prometheusSpec:
        # Select ALL PrometheusRules cluster-wide (Sloth-generated SLOs + our custom
        # rules), not just the chart's own release-labeled ones.
        ruleSelectorNilUsesHelmValues: false
        ruleNamespaceSelector: {}
        # External static targets — gooselab (NixOS) exporters, reached over the LAN
        # (192.168.4.0/22). Pods can't route the tailnet (100.x), so scrape the LAN IP.
        additionalScrapeConfigs:
          - job_name: gooselab-node
            static_configs:
              - targets: ["192.168.4.66:9100"]
                labels:
                  instance: gooselab
          - job_name: gooselab-smartctl
            static_configs:
              - targets: ["192.168.4.66:9633"]
                labels:
                  instance: gooselab
          - job_name: jellyfin
            metrics_path: /metrics
            static_configs:
              - targets: ["192.168.4.66:8096"]
                labels:
                  instance: gooselab
                  app: jellyfin
          # Synthetic / blackbox monitoring — probe the user-facing URLs from the cluster.
          # up/down (probe_success), latency (probe_duration_seconds), TLS cert expiry.
          - job_name: blackbox-http
            metrics_path: /probe
            params:
              module: [http_up]
            static_configs:
              - targets:
                  - https://watch.gonse.org
                  - https://request.gonse.org
                  - https://monitoring.y4bo.com
                  - https://id.y4bo.com
                  - https://login.y4bo.com
                  - https://audiobooks.y4bo.com
            relabel_configs:
              - source_labels: [__address__]
                target_label: __param_target
              - source_labels: [__param_target]
                target_label: instance
              - target_label: __address__
                replacement: blackbox-exporter:9115
