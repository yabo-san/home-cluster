apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tempo
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: tempo
      version: "1.24.4"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: monitoring
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Single-binary Tempo. Traces land on a filesystem PVC, no object store and
    # no database. Same shape as the Loki release next door.
    #
    # Pinned to WORKERNODE, not thinkserver: thinkserver was at 78% memory
    # (5937Mi) when this was added and workernode at 33%. local-path is
    # node-local so the PVC follows the pod.
    tempo:
      repository: grafana/tempo
      tag: 2.9.0
      retention: 168h
      # OTLP receivers. gRPC 4317 is what Keycloak defaults to; http 4318 is
      # what most SDKs use.
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
      # APM: turn received spans into RED metrics (span-metrics) and a service
      # map (service-graphs), written to Prometheus. Needs Prometheus's
      # remote-write receiver (kube-prometheus-stack release.yaml).
      metricsGenerator:
        enabled: true
        remoteWriteUrl: http://kube-prometheus-stack-prometheus.monitoring:9090/api/v1/write
      overrides:
        defaults:
          metrics_generator:
            processors:
              - service-graphs
              - span-metrics
      # Measured over 3 days at a 1536Mi limit: working set p90 527Mi, max
      # 738Mi. That is Tempo 2.9 with the metrics-generator on, idle or not.
      # CHG0030492 set request = limit = 512Mi and it died 181 times in 26h:
      # climbed to ~505Mi every start, GC thrashed at the ceiling, /ready
      # timed out, liveness killed it (INC0044922; INC0044909 was the same
      # symptom with a bigger limit and a scan-sized block).
      # Request stays 512Mi because the worker's requests are at 95% and
      # thinkserver has had 316Mi free in the same window. The limit is the
      # measured max plus headroom. This is the one pod on the worker whose
      # limit exceeds its request; the next one needs the third node.
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 1Gi
    nodeSelector:
      kubernetes.io/hostname: workernode
    persistence:
      enabled: true
      storageClassName: local-path
      size: 10Gi
    # Tempo exports its own metrics; scrape them with the rest. Without the
    # release label Prometheus never selected this monitor: applied, not scraped.
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: kube-prometheus-stack
