apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tempo
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: tempo
      version: "1.24.4"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: monitoring
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Single-binary Tempo. Traces land on a filesystem PVC, no object store and
    # no database. Same shape as the Loki release next door.
    #
    # Pinned to WORKERNODE, not thinkserver: thinkserver was at 78% memory
    # (5937Mi) when this was added and workernode at 33%. local-path is
    # node-local so the PVC follows the pod.
    tempo:
      repository: grafana/tempo
      tag: 2.9.0
      retention: 168h
      # OTLP receivers. gRPC 4317 is what Keycloak defaults to; http 4318 is
      # what most SDKs use.
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
      # APM: turn received spans into RED metrics (span-metrics) and a service
      # map (service-graphs), written to Prometheus. Needs Prometheus's
      # remote-write receiver (kube-prometheus-stack release.yaml).
      metricsGenerator:
        enabled: true
        remoteWriteUrl: http://kube-prometheus-stack-prometheus.monitoring:9090/api/v1/write
      overrides:
        defaults:
          metrics_generator:
            processors:
              - service-graphs
              - span-metrics
      # 768Mi was not enough to complete a block a RomM library scan filled at
      # 100% sampling: the GC thrashed at the ceiling, /ready timed out, and
      # liveness killed it on the same block every start.
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 1536Mi
    nodeSelector:
      kubernetes.io/hostname: workernode
    persistence:
      enabled: true
      storageClassName: local-path
      size: 10Gi
    # Tempo exports its own metrics; scrape them with the rest.
    serviceMonitor:
      enabled: true
