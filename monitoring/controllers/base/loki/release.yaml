apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki-stack
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: loki-stack
      version: "2.10.2"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: monitoring
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Loki: single-binary, filesystem-backed, on a Longhorn PVC. Light enough for
    # this node (~200Mi). Promtail (bundled) tails every pod's logs into it.
    loki:
      enabled: true
      # Prometheus stays the default datasource, not Loki. Fixed uid so Explore links
      # and any Loki dashboards resolve deterministically.
      isDefault: false
      datasource:
        uid: loki
      persistence:
        enabled: true
        storageClassName: longhorn
        size: 10Gi
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 512Mi
    promtail:
      enabled: true
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 128Mi
    # Grafana + Prometheus already come from kube-prometheus-stack — don't duplicate.
    grafana:
      enabled: false
    prometheus:
      enabled: false
