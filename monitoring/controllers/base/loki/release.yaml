apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: loki
      version: "7.3.0"        # maintained chart, Loki app 3.6.x (was loki-stack's EOL 2.6.1)
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: monitoring
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Single-binary Loki for a small cluster. Current version = compatible with Grafana 11
    # (health probe + log-volume queries work; the old 2.6.1 rejected them).
    deploymentMode: SingleBinary
    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      schemaConfig:
        configs:
          - from: "2024-04-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h
      storage:
        type: filesystem
      limits_config:
        volume_enabled: true      # the log-volume histogram Grafana asks for
        retention_period: 168h
      pattern_ingester:
        enabled: false
    singleBinary:
      replicas: 1
      persistence:
        enabled: true
        storageClass: longhorn
        size: 10Gi
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 768Mi
    # Single-binary → scale the distributed roles to zero.
    read:
      replicas: 0
    write:
      replicas: 0
    backend:
      replicas: 0
    # Disable memcached caches (multi-GB default requests), nginx gateway, canary, tests, minio.
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
    lokiCanary:
      enabled: false
    test:
      enabled: false
    gateway:
      enabled: false
    minio:
      enabled: false
