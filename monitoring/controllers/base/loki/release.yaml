apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: loki
      version: "7.3.0"        # maintained chart, Loki app 3.6.x (was loki-stack's EOL 2.6.1)
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: monitoring
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Single-binary Loki for a small cluster. Current version = compatible with Grafana 11
    # (health probe + log-volume queries work; the old 2.6.1 rejected them).
    deploymentMode: SingleBinary
    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      schemaConfig:
        configs:
          - from: "2024-04-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h
      storage:
        type: filesystem
      limits_config:
        volume_enabled: true      # the log-volume histogram Grafana asks for
        retention_period: 168h
      pattern_ingester:
        enabled: false
      # Log-based alerts (CHG0030485). The ruler was running with local storage
      # but no rule directory and no Alertmanager, so it could never fire.
      # Rules arrive as ConfigMaps labelled `loki_rule` in `monitoring`; the
      # rules sidecar writes them to /rules/fake (auth is off, so the tenant is
      # "fake", and local rule storage reads /rules/<tenant>/).
      rulerConfig:
        wal:
          dir: /var/loki/ruler-wal
        storage:
          type: local
          local:
            directory: /rules
        rule_path: /var/loki/rules-temp
        alertmanager_url: http://kube-prometheus-stack-alertmanager.monitoring:9093
        enable_api: true
        enable_alertmanager_v2: true
    singleBinary:
      replicas: 1
      # On workernode, not thinkserver. Logs are disposable (168h retention) so
      # this is the one stateful workload that can move without a migration.
      nodeSelector:
        kubernetes.io/hostname: workernode
      persistence:
        enabled: true
        storageClass: local-path
        size: 10Gi
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 768Mi
    # Single-binary → scale the distributed roles to zero.
    read:
      replicas: 0
    write:
      replicas: 0
    backend:
      replicas: 0
    # Disable memcached caches (multi-GB default requests), nginx gateway, canary, tests, minio.
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
    lokiCanary:
      enabled: false
    test:
      enabled: false
    gateway:
      enabled: false
    minio:
      enabled: false
    sidecar:
      rules:
        folder: /rules/fake
