# Database alerts from the exporters (CHG0030484). Until these, a database was
# visible only as a container: it could be up and refusing connections, full
# of locks, or out of connection slots, and nothing would say so.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: databases
  namespace: monitoring
  labels:
    role: alert-rules
spec:
  groups:
    - name: databases
      rules:
        - alert: DatabaseDown
          # The exporter is up but cannot talk to its database.
          expr: |
            pg_up == 0 or mysql_up == 0 or redis_up == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.db }} is not accepting connections"
            runbook: "kubectl -n {{ $labels.namespace }} get pods; logs of the database pod. The app in the same namespace is down or about to be."

        - alert: DatabaseExporterDown
          expr: |
            up{job=~".*db-exporters.*"} == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Exporter for {{ $labels.db }} is not being scraped"
            runbook: "kubectl -n {{ $labels.namespace }} get pods -l app.kubernetes.io/component=db-exporter. Monitoring is blind to that database until it is back."

        - alert: PostgresConnectionsNearMax
          expr: |
            sum by (db, namespace) (pg_stat_activity_count)
              / on (db, namespace) group_left max by (db, namespace) (pg_settings_max_connections) > 0.8
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.db }} is using {{ $value | humanizePercentage }} of max_connections"
            runbook: "A connection leak in the app, or a burst (imports, scans). pg_stat_activity by state shows which: many 'idle in transaction' is the app."

        - alert: PostgresDeadlocks
          expr: |
            increase(pg_stat_database_deadlocks{datname!~"template.*|postgres"}[15m]) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.db }}: {{ $value | humanize }} deadlock(s) in database {{ $labels.datname }} in 15m"
            runbook: "Postgres log on the database pod shows both statements. Usually concurrent app writers (imports) on the same rows."

        - alert: MariaDBConnectionsNearMax
          expr: |
            mysql_global_status_threads_connected / mysql_global_variables_max_connections > 0.8
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.db }} is using {{ $value | humanizePercentage }} of max_connections"
            runbook: "RomM's library scan opens many connections; if this fires outside a scan, the app is leaking them."

        - alert: MariaDBSlowQueries
          expr: |
            rate(mysql_global_status_slow_queries[5m]) > 0.1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.db }}: {{ $value | humanize }} slow queries/s"
            runbook: "Expected during a full library scan. Outside one, check the scan state in RomM and the node's iowait (NodeIOWaitHigh)."

        - alert: RedisMemoryHigh
          # Paperless's Redis is its task queue; a backlog grows here first.
          expr: |
            redis_memory_used_bytes / redis_memory_max_bytes > 0.85 and redis_memory_max_bytes > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.db }} memory at {{ $value | humanizePercentage }} of maxmemory"
            runbook: "Paperless tasks are piling up (consumer stuck, OCR backlog). Check the Paperless task list and its worker logs."

        - alert: RedisQueueBacklog
          expr: |
            sum by (db, namespace) (redis_key_size{key=~"celery.*"}) > 100
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.db }}: {{ $value }} tasks waiting in the queue for 30m"
            runbook: "Paperless's worker is not draining the queue. kubectl -n paperless logs deploy/paperless | grep -i celery."
