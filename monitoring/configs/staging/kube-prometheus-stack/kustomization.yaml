apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - grafana-tls-secret.yaml
  - grafana-admin-secret.yaml
  - grafana-oidc-secret.yaml
  - grafana-smtp-secret.yaml
  - homelab-storage-rules.yaml
  - synthetic-rules.yaml
  - jellyfin-rules.yaml
  - loki-datasource.yaml
# Dashboards: any ConfigMap labeled grafana_dashboard=1 in the monitoring namespace
# is auto-loaded by Grafana's sidecar. Drop more .json files here + list them below.
configMapGenerator:
  - name: grafana-dashboard-namespaces
    files:
      - dashboards/simple-namespace-overview.json
    options:
      labels:
        grafana_dashboard: "1"
  - name: grafana-dashboard-node-exporter
    files:
      - dashboards/node-exporter-full.json
    options:
      labels:
        grafana_dashboard: "1"
  - name: grafana-dashboard-homelab-overview
    files:
      - dashboards/homelab-overview.json
    options:
      labels:
        grafana_dashboard: "1"
  - name: grafana-dashboard-cluster-logs
    files:
      - dashboards/cluster-logs.json
    options:
      labels:
        grafana_dashboard: "1"
  - name: grafana-dashboard-synthetic-monitoring
    files:
      - dashboards/synthetic-monitoring.json
    options:
      labels:
        grafana_dashboard: "1"
  - name: grafana-dashboard-active-alerts
    files:
      - dashboards/active-alerts.json
    options:
      labels:
        grafana_dashboard: "1"
  - name: grafana-dashboard-jellyfin-simple
    files:
      - dashboards/jellyfin-simple.json
    options:
      labels:
        grafana_dashboard: "1"
generatorOptions:
  disableNameSuffixHash: true
