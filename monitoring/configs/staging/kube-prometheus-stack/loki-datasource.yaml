# Loki datasource for Grafana. The grafana/loki chart (unlike the old loki-stack) does
# not auto-provision one, so we supply it as a sidecar-loaded ConfigMap. Prometheus stays
# the default; fixed uid:loki so Explore links resolve.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-loki-datasource
  namespace: monitoring
  labels:
    grafana_datasource: "1"
data:
  loki-datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        uid: loki
        access: proxy
        url: http://loki:3100
        isDefault: false
        jsonData:
          maxLines: 1000
