# Every tunnel connector, :2000 metrics.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cloudflared
  namespace: monitoring
spec:
  namespaceSelector:
    any: true
  selector:
    matchExpressions:
      - key: app
        operator: In
        values: [cloudflared-drop, cloudflared-keycloak, cloudflared-portal, cloudflared-romm, cloudflared-grafana, cloudflared-lldap, cloudflared]
  podMetricsEndpoints:
    - targetPort: 2000
      path: /metrics
      interval: 30s
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_label_app]
          targetLabel: tunnel
          regex: cloudflared-?(.*)
          replacement: "${1}"
