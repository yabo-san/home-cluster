# Scrape every Cloudflare tunnel connector (two per tunnel, five tunnels). Each
# already serves metrics on :2000 (`metrics: 0.0.0.0:2000` in its config.yaml,
# the same port its liveness probe hits); nothing scraped them, so a tunnel
# that lost its edge connections only showed up as a failed blackbox probe
# after users did (INC0044914, the home internet blip).
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cloudflared
  namespace: monitoring
spec:
  namespaceSelector:
    any: true
  selector:
    matchExpressions:
      - key: app
        operator: In
        values: [cloudflared-drop, cloudflared-keycloak, cloudflared-portal, cloudflared-romm, cloudflared-grafana, cloudflared]
  podMetricsEndpoints:
    - targetPort: 2000
      path: /metrics
      interval: 30s
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_label_app]
          targetLabel: tunnel
          regex: cloudflared-?(.*)
          replacement: "${1}"
