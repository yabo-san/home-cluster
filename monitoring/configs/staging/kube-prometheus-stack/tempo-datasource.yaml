# Tempo datasource for Grafana, provisioned the same way as Loki: a ConfigMap the
# Grafana sidecar picks up. Fixed uid:tempo so trace links resolve.
#
# tracesToLogsV2 wires a trace span to the matching Loki logs, which is the whole
# point of having both in one Grafana.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-tempo-datasource
  namespace: monitoring
  labels:
    grafana_datasource: "1"
data:
  tempo-datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Tempo
        type: tempo
        uid: tempo
        access: proxy
        url: http://tempo:3200
        isDefault: false
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: -1m
            spanEndTimeShift: 1m
            filterByTraceID: true
          nodeGraph:
            enabled: true
          # Service map and RED panels come from Tempo's metrics-generator,
          # stored in Prometheus.
          serviceMap:
            datasourceUid: prometheus
          tracesToMetrics:
            datasourceUid: prometheus
